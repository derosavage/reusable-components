version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: backend
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d backend"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m services.auth_service.app
    ports:
      - "8001:8001"
    environment:
      - ENV=development
      - DATABASE_URL=postgresql+asyncpg://user:pass@postgres:5432/backend
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m services.api_gateway.app
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - AUTH_SERVICE_URL=http://auth-service:8001
      - ANALYTICS_SERVICE_URL=http://analytics-service:8002
      - DATA_FACTORY_URL=http://data-factory:8003
      - DARAJA_SERVICE_URL=http://daraja-service:8004
      - LLM_SERVICE_URL=http://llm-service:8005
    depends_on:
      - auth-service

  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.analytics_service.app:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    environment:
      - ENV=development
      - DUCKDB_PATH=/data/analytics.db
    volumes:
      - analytics-data:/data
    depends_on:
      - redis

  data-factory:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m services.data_factory.app
    ports:
      - "8003:8003"
    environment:
      - ENV=development

  daraja-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m services.daraja_service.app
    ports:
      - "8004:8004"
    environment:
      - ENV=development
      - DARAJA_ENV=sandbox

  llm-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn services.llm_service.app:app --host 0.0.0.0 --port 8005
    ports:
      - "8005:8005"
    environment:
      - ENV=development

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A worker.celery_app worker --loglevel=info
    environment:
      - ENV=development
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy

  flower:
    image: mher/flower:2.0
    command: celery flower --broker=redis://redis:6379/1 --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - worker

volumes:
  pgdata:
  miniodata:
  analytics-data:
